name: Bug report
description: A script crashes or produces wrong output
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Command you ran and the full traceback or wrong output.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "commit abc1234, M2 Pro 32 GB, macOS 15.x, Python 3.12, mlx 0.32.3"
    validations:
      required: true
